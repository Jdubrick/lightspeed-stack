# POC ONLY — do not commit.
# Keycloak IdP with a pre-imported realm (client_credentials, 120s token lifespan).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: oauth-poc
  labels:
    app: keycloak
data:
  poc-realm.json: |
    {
      "realm": "poc",
      "enabled": true,
      "sslRequired": "none",
      "registrationAllowed": false,
      "loginWithEmailAllowed": false,
      "duplicateEmailsAllowed": false,
      "resetPasswordAllowed": false,
      "editUsernameAllowed": false,
      "accessTokenLifespan": 120,
      "accessTokenLifespanForImplicitFlow": 120,
      "ssoSessionIdleTimeout": 1800,
      "ssoSessionMaxLifespan": 36000,
      "clients": [
        {
          "clientId": "lcs-client",
          "name": "Lightspeed Core Stack POC client",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "poc-secret",
          "serviceAccountsEnabled": true,
          "standardFlowEnabled": false,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "authorizationServicesEnabled": false,
          "fullScopeAllowed": true,
          "attributes": {
            "access.token.lifespan": "120"
          },
          "defaultClientScopes": [
            "roles",
            "profile",
            "email"
          ],
          "optionalClientScopes": [
            "inference"
          ]
        }
      ],
      "clientScopes": [
        {
          "name": "inference",
          "description": "POC inference scope",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "true",
            "display.on.consent.screen": "false"
          },
          "protocolMappers": [
            {
              "name": "audience-inference",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "lcs-client",
                "id.token.claim": "false",
                "access.token.claim": "true"
              }
            }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: oauth-poc
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0
          args:
            - start-dev
            - --http-port=8080
            - --hostname-strict=false
            - --import-realm
          env:
            - name: KEYCLOAK_ADMIN
              value: admin
            - name: KEYCLOAK_ADMIN_PASSWORD
              value: admin
            - name: KC_HEALTH_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
          readinessProbe:
            httpGet:
              path: /realms/poc
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /realms/poc
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm
            items:
              - key: poc-realm.json
                path: poc-realm.json
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: oauth-poc
  labels:
    app: keycloak
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
