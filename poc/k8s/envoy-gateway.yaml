# POC ONLY — do not commit.
# Envoy gateway: validates Bearer JWTs via Keycloak JWKS, then proxies to Ollama.
# Issuer validation is disabled so tokens minted via localhost port-forward still
# validate against cluster-internal JWKS.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
  namespace: oauth-poc
  labels:
    app: envoy-gateway
data:
  envoy.yaml: |
    admin:
      address:
        socket_address:
          address: 127.0.0.1
          port_value: 9901

    static_resources:
      listeners:
        - name: listener_0
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 8080
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress_http
                    codec_type: AUTO
                    route_config:
                      name: local_route
                      virtual_hosts:
                        - name: ollama
                          domains: ["*"]
                          routes:
                            - match:
                                prefix: "/"
                              route:
                                cluster: ollama
                                timeout: 300s
                    http_filters:
                      - name: envoy.filters.http.jwt_authn
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                          providers:
                            keycloak:
                              # Skip issuer check: LCS fetches tokens via localhost
                              # port-forward, so iss is http://localhost:8082/... while
                              # Envoy validates via cluster-internal JWKS.
                              forward: true
                              from_headers:
                                - name: Authorization
                                  value_prefix: "Bearer "
                              remote_jwks:
                                http_uri:
                                  uri: http://keycloak.oauth-poc.svc.cluster.local:8080/realms/poc/protocol/openid-connect/certs
                                  cluster: keycloak
                                  timeout: 5s
                                cache_duration:
                                  seconds: 300
                          rules:
                            - match:
                                prefix: "/"
                              requires:
                                provider_name: keycloak
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:
        - name: ollama
          type: STRICT_DNS
          connect_timeout: 5s
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: ollama
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: ollama.oauth-poc.svc.cluster.local
                          port_value: 11434

        - name: keycloak
          type: STRICT_DNS
          connect_timeout: 5s
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: keycloak
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: keycloak.oauth-poc.svc.cluster.local
                          port_value: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-gateway
  namespace: oauth-poc
  labels:
    app: envoy-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: envoy-gateway
  template:
    metadata:
      labels:
        app: envoy-gateway
    spec:
      containers:
        - name: envoy
          image: docker.io/envoyproxy/envoy:v1.31-latest
          args:
            - -c
            - /etc/envoy/envoy.yaml
            - --log-level
            - info
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/envoy
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: envoy-config
            items:
              - key: envoy.yaml
                path: envoy.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: envoy-gateway
  namespace: oauth-poc
  labels:
    app: envoy-gateway
spec:
  selector:
    app: envoy-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
